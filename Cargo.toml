[package]
name = "daiana"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
actix-ws = "0.4.0"
env_logger = { version = "0.11.11", features = ["color"]}
log = "0.4.34"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"]}
serde_json = { version = "1.0.151"}
derive_more = { version = "2.1.1", features = ["std", "display", "error"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
futures-util = "0.3.34"
dotenv = "0.15.0"
bytes = "1.12.1"
actix-cors = "0.7.2"

[dev-dependencies]
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", features = ["json"] }
