services:
  daiana:
    image: ghcr.io/lunna5/daiana:latest
    container_name: daiana
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - MAX_CLIENTS_ON_CHANNEL=5
      - CHANNEL_TIMEOUT=30
      - MAX_PACKETS_PER_SEC=100
      - MAX_PACKET_SIZE_BYTES=65536
      - RUST_LOG=info
